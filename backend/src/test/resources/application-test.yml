spring:
  datasource:
    url: jdbc:h2:mem:careerlink-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

careerlink:
  privacy:
    retention-days: 30
    masking-cron: "0 0 3 * * *"
