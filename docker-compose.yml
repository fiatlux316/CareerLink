name: careerlink

services:
  postgres:
    image: postgres:16-alpine
    container_name: careerlink-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerlink}
      POSTGRES_USER: ${POSTGRES_USER:-careerlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerlink}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerlink} -d ${POSTGRES_DB:-careerlink}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      #- /Users/jck/WORK/DEV/volume/postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: careerlink-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/careerlink}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-careerlink}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-careerlink}
    ports:
      - "8090:8080"

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: careerlink-frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend-node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  frontend-node_modules:
